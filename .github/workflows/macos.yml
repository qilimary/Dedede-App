name: Mac app (Apple Silicon + Intel)
permissions:
  contents: read
concurrency:
  group: macos-${{ github.ref }}
  cancel-in-progress: false
env:
  PYTHONIOENCODING: utf-8
  PYTHONUTF8: '1'
  DOTNET_CLI_TELEMETRY_OPTOUT: '1'
  DOTNET_NOLOGO: '1'
'on':
  push:
    branches:
      - main
    paths:
      - dedede-macos.py
      - .github/workflows/macos.yml
      - dedede-build.sh
      - 错别字.txt
  workflow_dispatch: {}
jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Mac Apple Silicon
            runner: macos-15
            platform: macos
            rid: osx-arm64
            label: AppleSilicon
          - name: Mac Intel
            runner: macos-15-intel
            platform: macos
            rid: osx-x64
            label: Intel
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - name: Verify and restore macos sources
        shell: bash
        run: python dedede-macos.py
      - name: Sync current Android grammar and dictionary
        shell: bash
        run: python macos/shared/scripts/sync_android.py --repo .
      - name: Regression check for bundle signing
        shell: bash
        run: |
          # On macOS the default temp dir /var/folders/... is a symlink to /private/var/folders/...
          # The signing code returns the resolved (/private/var/...) path, while the test compares it
          # with the unresolved temp path. Point TMPDIR at the real path so both sides match.
          TMPDIR="$(python -c 'import os, tempfile; print(os.path.realpath(tempfile.gettempdir()))')"
          export TMPDIR
          echo "TMPDIR=$TMPDIR"
          python macos/tests/test_sign_bundle.py
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68
        with:
          global-json-file: macos/global.json
      - name: Cache verified model
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: macos/shared/assets/models/HCAM_V2_5CHAR_INT8_PT.onnx
          key: dedede-model-15f0af5c03857ac2b049ac9f02cfe1dde2fba11ea639e191ca6453cb9a6e75cc
          enableCrossOsArchive: true
      - name: Build native Mac package, model and OCR checks
        shell: bash
        run: bash macos/build.sh "${{ matrix.rid }}"
      - name: Stage installer
        shell: bash
        run: |
          mkdir -p delivery
          cp "macos/dist/Dedede-Mac-${{ matrix.label }}.dmg" "macos/dist/Dedede-Mac-${{ matrix.label }}.zip" delivery/
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: Installer-${{ matrix.label }}
          path: delivery/*
          if-no-files-found: error
          retention-days: 30
          compression-level: 0
      - name: Upload diagnostics and real UI previews
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: Checks-and-previews-${{ matrix.label }}
          path: |-
            source-verification.json
            macos/shared/assets/android-sync.json
            macos/dist/*.json
            macos/dist/previews-*/
          if-no-files-found: ignore
          retention-days: 14
        if: always()
  publish:
    name: Publish macos installers
    needs: build
    if: ${{ needs.build.result == 'success' && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          pattern: Installer-*
          path: installers
          merge-multiple: true
      - name: Publish direct downloads
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          cat > release-notes.md <<'NOTES'
          macOS 14+，Apple Silicon 与 Intel 原生离线包。DMG 拖入 Applications 安装；ZIP 内为同一 DMG。版本 1.2.3，同步当前安卓规则。本机签名，未 Apple 公证。
          NOTES
          test -s installers/Dedede-Mac-AppleSilicon.dmg
          test -s installers/Dedede-Mac-Intel.dmg
          test -s installers/Dedede-Mac-AppleSilicon.zip
          test -s installers/Dedede-Mac-Intel.zip
          if gh release view macos-latest --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload macos-latest installers/Dedede-Mac-AppleSilicon.dmg installers/Dedede-Mac-Intel.dmg installers/Dedede-Mac-AppleSilicon.zip installers/Dedede-Mac-Intel.zip --repo "$GITHUB_REPOSITORY" --clobber
            gh release edit macos-latest --repo "$GITHUB_REPOSITORY" --notes-file release-notes.md
          else
            gh release create macos-latest installers/Dedede-Mac-AppleSilicon.dmg installers/Dedede-Mac-Intel.dmg installers/Dedede-Mac-AppleSilicon.zip installers/Dedede-Mac-Intel.zip --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --title '纠错 Pro Mac（最新版）' --notes-file release-notes.md --latest=false
          fi
