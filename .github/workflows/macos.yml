name: Mac app (Apple Silicon)
permissions:
  contents: read
concurrency:
  group: macos-${{ github.ref }}
  cancel-in-progress: false
env:
  PYTHONIOENCODING: utf-8
  PYTHONUTF8: '1'
  DOTNET_CLI_TELEMETRY_OPTOUT: '1'
  DOTNET_NOLOGO: '1'
'on':
  push:
    branches:
      - main
    paths:
      - dedede-macos.py
      - .github/workflows/macos.yml
      - dedede-build.sh
      - 错别字.txt
  workflow_dispatch: {}
jobs:
  seed-model:
    name: Seed model cache
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - name: Verify and restore macos sources
        shell: bash
        run: python dedede-macos.py
      - name: Restore cached model
        id: cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: macos/shared/assets/models/HCAM_V2_5CHAR_INT8_PT.onnx
          key: dedede-model-macos-0331956749c267c5f7022c9b842057067660babe090d1fe87005eb56c6dc480f
          enableCrossOsArchive: true
      - name: Download model when the cache is cold
        if: steps.cache.outputs.cache-hit != 'true'
        continue-on-error: true
        shell: bash
        env:
          DEDEDE_MODEL_MIRRORS: 'https://github.com/${{ github.repository }}/releases/download/model-assets/{filename}'
        run: |
          python3 -m pip install gdown==5.2.0
          python3 macos/shared/scripts/fetch_model.py
      - name: Save model for macOS builds
        if: steps.cache.outputs.cache-hit != 'true' && hashFiles('macos/shared/assets/models/HCAM_V2_5CHAR_INT8_PT.onnx') != ''
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        continue-on-error: true
        with:
          path: macos/shared/assets/models/HCAM_V2_5CHAR_INT8_PT.onnx
          key: dedede-model-macos-0331956749c267c5f7022c9b842057067660babe090d1fe87005eb56c6dc480f
          enableCrossOsArchive: true
  build:
    needs: seed-model
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Mac Apple Silicon
            runner: macos-15
            platform: macos
            rid: osx-arm64
            label: AppleSilicon
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - name: Verify and restore macos sources
        shell: bash
        run: python dedede-macos.py
      - name: Sync current Android grammar and dictionary
        shell: bash
        run: python macos/shared/scripts/sync_android.py --repo .
      - name: Regression check for bundle signing
        shell: bash
        run: |
          # On macOS the default temp dir /var/folders/... is a symlink to /private/var/folders/...
          # The signing code returns the resolved (/private/var/...) path, while the test compares it
          # with the unresolved temp path. Point TMPDIR at the real path so both sides match.
          TMPDIR="$(python -c 'import os, tempfile; print(os.path.realpath(tempfile.gettempdir()))')"
          export TMPDIR
          echo "TMPDIR=$TMPDIR"
          python macos/tests/test_sign_bundle.py
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68
        with:
          global-json-file: macos/global.json
      - name: Restore cached model (macOS entry)
        id: model_macos
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: macos/shared/assets/models/HCAM_V2_5CHAR_INT8_PT.onnx
          key: dedede-model-macos-0331956749c267c5f7022c9b842057067660babe090d1fe87005eb56c6dc480f
          enableCrossOsArchive: true
      - name: Restore cached model (entry shared with Windows builds)
        id: model_shared
        if: steps.model_macos.outputs.cache-hit != 'true'
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          # The path must match windows.yml exactly: the cache version hash covers the
          # path list, and the archive extracts to the path it was saved from.
          path: windows/assets/models/HCAM_V2_5CHAR_INT8_PT.onnx
          key: dedede-model-0331956749c267c5f7022c9b842057067660babe090d1fe87005eb56c6dc480f
          enableCrossOsArchive: true
      - name: Place the Windows-shared model for the macOS build
        if: steps.model_macos.outputs.cache-hit != 'true'
        shell: bash
        run: |
          if [ -f windows/assets/models/HCAM_V2_5CHAR_INT8_PT.onnx ]; then
            mkdir -p macos/shared/assets/models
            cp windows/assets/models/HCAM_V2_5CHAR_INT8_PT.onnx macos/shared/assets/models/HCAM_V2_5CHAR_INT8_PT.onnx
            echo 'Model restored from the cache entry shared with Windows builds.'
          fi
      - name: Build native Mac package, model and OCR checks
        shell: bash
        env:
          DEDEDE_MODEL_MIRRORS: 'https://github.com/${{ github.repository }}/releases/download/model-assets/{filename}'
        run: bash macos/build.sh "${{ matrix.rid }}"
      - name: Save model to the macOS cache entry even when the build fails
        if: always() && steps.model_macos.outputs.cache-hit != 'true' && hashFiles('macos/shared/assets/models/HCAM_V2_5CHAR_INT8_PT.onnx') != ''
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        continue-on-error: true
        with:
          path: macos/shared/assets/models/HCAM_V2_5CHAR_INT8_PT.onnx
          key: dedede-model-macos-0331956749c267c5f7022c9b842057067660babe090d1fe87005eb56c6dc480f
          enableCrossOsArchive: true
      - name: Stage installer
        shell: bash
        run: |
          mkdir -p delivery
          cp "macos/dist/Dedede-Mac-${{ matrix.label }}.dmg" "macos/dist/Dedede-Mac-${{ matrix.label }}.zip" delivery/
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: Installer-${{ matrix.label }}
          path: delivery/*
          if-no-files-found: error
          retention-days: 30
          compression-level: 0
      - name: Upload diagnostics and real UI previews
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: Checks-and-previews-${{ matrix.label }}
          path: |-
            source-verification.json
            macos/shared/assets/android-sync.json
            macos/dist/*.json
            macos/dist/previews-*/
          if-no-files-found: ignore
          retention-days: 14
        if: always()
  publish:
    name: Publish macos installers
    needs: build
    if: ${{ needs.build.result == 'success' && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          pattern: Installer-*
          path: installers
          merge-multiple: true
      - name: Publish direct downloads
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          cat > release-notes.md <<'NOTES'
          macOS 14+，Apple Silicon（M 系列芯片）原生离线包，Intel 芯片 Mac 已不再支持。DMG 拖入 Applications 安装；ZIP 内为同一 DMG。版本 1.2.3，同步当前安卓规则。本机签名，未 Apple 公证。
          NOTES
          test -s installers/Dedede-Mac-AppleSilicon.dmg
          test -s installers/Dedede-Mac-AppleSilicon.zip
          if gh release view macos-latest --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload macos-latest installers/Dedede-Mac-AppleSilicon.dmg installers/Dedede-Mac-AppleSilicon.zip --repo "$GITHUB_REPOSITORY" --clobber
            gh release edit macos-latest --repo "$GITHUB_REPOSITORY" --notes-file release-notes.md
          else
            gh release create macos-latest installers/Dedede-Mac-AppleSilicon.dmg installers/Dedede-Mac-AppleSilicon.zip --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --title '纠错 Pro Mac（最新版）' --notes-file release-notes.md --latest=false
          fi
          # Remove stale Intel assets left over from older releases, if any.
          for asset in Dedede-Mac-Intel.dmg Dedede-Mac-Intel.zip; do
            gh release delete-asset macos-latest "$asset" --repo "$GITHUB_REPOSITORY" --yes 2>/dev/null || true
          done
