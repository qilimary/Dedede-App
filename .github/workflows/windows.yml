name: Windows app
permissions:
  contents: read
concurrency:
  group: windows-${{ github.ref }}
  cancel-in-progress: false
env:
  PYTHONIOENCODING: utf-8
  PYTHONUTF8: '1'
  DOTNET_CLI_TELEMETRY_OPTOUT: '1'
  DOTNET_NOLOGO: '1'
jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
        - name: Windows x64
          runner: windows-2022
          platform: windows
          rid: win-x64
          label: Windows
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
    - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
      with:
        python-version: '3.12'
    - name: Verify and restore windows sources
      shell: bash
      run: python dedede-windows.py
    - name: Sync current Android grammar and dictionary
      shell: bash
      run: python windows/scripts/sync_android.py --repo .
    - name: Regression check for shortcut validation
      shell: pwsh
      run: '& windows/tests/check_shortcuts.Tests.ps1'
    - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68
      with:
        global-json-file: windows/global.json
    - name: Cache verified model
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
      with:
        path: windows/assets/models/HCAM_V2_5CHAR_INT8_PT.onnx
        key: dedede-model-15f0af5c03857ac2b049ac9f02cfe1dde2fba11ea639e191ca6453cb9a6e75cc
        enableCrossOsArchive: true
    - name: Build Windows and installer
      shell: pwsh
      run: |
        $ErrorActionPreference='Stop'
        $repoRoot=$env:GITHUB_WORKSPACE
        & "$repoRoot/windows/build.ps1" -Installer
        Set-Location $repoRoot
        if(-not(Test-Path "$repoRoot/windows/dist/Dedede-Windows-Setup.exe")){throw 'Installer missing.'}
    - name: Test installed Windows files
      shell: pwsh
      run: |
        $ErrorActionPreference='Stop'
        # Both desktop and Start menu shortcuts are validated and logged.
        $install=Join-Path $env:RUNNER_TEMP 'Dedede Installer Check'
        $log=Join-Path $env:GITHUB_WORKSPACE 'windows/dist/install-test.log'
        $setup=Start-Process 'windows/dist/Dedede-Windows-Setup.exe' -ArgumentList '/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART','/SP-','/TASKS=desktopicon',('/DIR="'+$install+'"'),('/LOG="'+$log+'"') -PassThru
        if(-not $setup.WaitForExit(180000)){Stop-Process -Id $setup.Id -Force;throw 'Installer timeout.'}
        if($setup.ExitCode -notin @(0,3010)){throw "Installer exit code $($setup.ExitCode)"}
        $runtime=Start-Process "$install/Dedede-Launcher.exe" -ArgumentList '--check-runtime' -PassThru
        if(-not $runtime.WaitForExit(60000)){Stop-Process -Id $runtime.Id -Force;throw 'Runtime check timeout.'}
        $runtime.WaitForExit()
        $runtimeFiles=@('vcruntime140.dll','vcruntime140_1.dll','msvcp140.dll','msvcp140_1.dll')|ForEach-Object {
          $file=Get-Item (Join-Path $env:SystemRoot "System32/$_") -ErrorAction SilentlyContinue
          [pscustomobject]@{name=$_;exists=($null -ne $file);version=if($file){$file.VersionInfo.FileVersion}else{$null}}
        }
        @{exitCode=$runtime.ExitCode;files=$runtimeFiles}|ConvertTo-Json -Depth 4|Set-Content 'windows/dist/runtime-check.json' -Encoding utf8
        if($runtime.ExitCode -ne 0){throw "Installed runtime check failed (exit $($runtime.ExitCode))."}
        foreach($binary in @('Dedede.exe','Dedede-Launcher.exe')){
          $bytes=[IO.File]::ReadAllBytes((Join-Path $install $binary))
          $pe=[BitConverter]::ToInt32($bytes,0x3c)
          if([BitConverter]::ToUInt16($bytes,$pe+24+68) -ne 2){throw "$binary must use GUI subsystem, never console."}
        }
        & "$env:GITHUB_WORKSPACE/windows/scripts/check_shortcuts.ps1" -InstallDirectory $install -Report "$env:GITHUB_WORKSPACE/windows/dist/shortcut-check.json"
        $report=Join-Path $env:GITHUB_WORKSPACE 'windows/dist/installed-smoke.json'
        $app=Start-Process "$install/Dedede-Launcher.exe" -ArgumentList '--safe-render','--smoke-test',('"'+$report+'"') -PassThru
        if(-not $app.WaitForExit(180000)){Stop-Process -Id $app.Id -Force;throw 'Installed app timeout.'}
        if($app.ExitCode -ne 0 -or -not(Test-Path $report) -or -not((Get-Content $report -Raw|ConvertFrom-Json).passed)){throw 'Installed model/OCR check failed.'}
    - name: Render actual Windows UI
      shell: pwsh
      run: |
        $ErrorActionPreference='Stop'
        $out=Join-Path $env:GITHUB_WORKSPACE 'windows/dist/previews'
        $app=Start-Process 'windows/dist/Dedede-Windows-x64/Dedede.exe' -ArgumentList '--safe-render','--render-preview',('"'+$out+'"') -PassThru
        if(-not($app.WaitForExit(180000))){
          Stop-Process -Id $app.Id -Force -ErrorAction SilentlyContinue
          throw 'UI preview timed out. A hung app must fail the build; otherwise a broken installer would be published.'
        }
        if($app.ExitCode -ne 0){
          throw "UI preview crashed with exit code $($app.ExitCode). A crashing app must fail the build; see preview-error.log in the Checks-and-previews artifact."
        }
        if(-not(Test-Path "$out/07-dark.png")){
          Write-Warning 'UI preview finished without producing 07-dark.png. Continuing because render assertions are diagnostic only.'
        } else {
          Write-Host 'UI preview completed successfully.'
        }
    - name: Stage installer
      shell: bash
      run: |
        mkdir -p delivery
        cp windows/dist/Dedede-Windows-Setup.exe windows/dist/Dedede-Windows-Setup.zip delivery/
    - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
      with:
        name: Installer-${{ matrix.label }}
        path: delivery/*
        if-no-files-found: error
        retention-days: 30
        compression-level: 0
    - name: Upload diagnostics and real UI previews
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
      with:
        name: Checks-and-previews-${{ matrix.label }}
        path: |-
          source-verification.json
          windows/assets/android-sync.json
          windows/dist/*.json
          windows/dist/*.log
          windows/dist/previews/
        if-no-files-found: ignore
        retention-days: 14
      if: always()
  publish:
    name: Publish windows installers
    needs: build
    if: ${{ needs.build.result == 'success' && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
    - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
      with:
        pattern: Installer-Windows
        path: installers
        merge-multiple: true
    - name: Publish direct downloads
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        set -euo pipefail
        cat > release-notes.md <<'NOTES'
        Windows 10/11 x64 离线安装程序。EXE 可直接安装；ZIP 内为同一完整安装程序。当前用户安装，提供启动诊断与兼容启动。版本 1.2.3，同步当前安卓规则。
        NOTES
        test -s installers/Dedede-Windows-Setup.exe
        test -s installers/Dedede-Windows-Setup.zip
        if gh release view windows-latest --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
          gh release upload windows-latest installers/Dedede-Windows-Setup.exe installers/Dedede-Windows-Setup.zip --repo "$GITHUB_REPOSITORY" --clobber
          gh release edit windows-latest --repo "$GITHUB_REPOSITORY" --notes-file release-notes.md
        else
          gh release create windows-latest installers/Dedede-Windows-Setup.exe installers/Dedede-Windows-Setup.zip --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --title '纠错 Pro Windows（最新版）' --notes-file release-notes.md --latest=false
        fi
'on':
  push:
    branches:
    - main
    paths:
    - dedede-windows.py
    - .github/workflows/windows.yml
    - dedede-build.sh
    - 错别字.txt
  workflow_dispatch: {}
