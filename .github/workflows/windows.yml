name: Desktop apps (Windows + Mac)
on:
  push:
    branches: [main]
    paths: [Dedede-Windows-source.zip, .github/workflows/windows.yml]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: desktop-${{ github.ref }}
  cancel-in-progress: false
env:
  PYTHONIOENCODING: utf-8
  PYTHONUTF8: '1'
  DOTNET_CLI_TELEMETRY_OPTOUT: '1'
  DOTNET_NOLOGO: '1'
jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - {name: Windows x64, runner: windows-2022, platform: windows, rid: win-x64, label: Windows}
          - {name: Mac Apple Silicon, runner: macos-15, platform: macos, rid: osx-arm64, label: AppleSilicon}
          - {name: Mac Intel, runner: macos-15-intel, platform: macos, rid: osx-x64, label: Intel}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - name: Verify and extract source package
        shell: bash
        run: |
          python - <<'PY'
          import hashlib, json, pathlib, zipfile
          root=pathlib.Path.cwd().resolve()
          with zipfile.ZipFile('Dedede-Windows-source.zip') as z:
              entries=z.infolist(); names=[i.filename for i in entries]
              assert len(names)==len(set(names)), 'Duplicate ZIP paths'
              assert sum(i.file_size for i in entries)<200_000_000, 'Unexpected source size'
              files=json.loads(z.read('SOURCE-SHA256.json'))['files']
              assert set(names)==set(files)|{'SOURCE-SHA256.json'}, 'Manifest mismatch'
              for name,digest in files.items():
                  p=pathlib.PurePosixPath(name)
                  assert not p.is_absolute() and '..' not in p.parts and '\\' not in name and ':' not in name, 'Unsafe path'
                  assert p.parts[0] in ('windows','macos'), 'Unexpected source directory'
                  data=z.read(name)
                  assert hashlib.sha256(data).hexdigest()==digest, 'Checksum mismatch: '+name
                  target=root.joinpath(*p.parts)
                  assert target.resolve().is_relative_to(root), 'Escaping path'
                  target.parent.mkdir(parents=True,exist_ok=True); target.write_bytes(data)
          print('Verified and extracted',len(files),'source files')
          PY
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: windows/global.json
      - name: Cache verified model
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: windows/assets/models/HCAM_V2_5CHAR_INT8_PT.onnx
          key: dedede-model-15f0af5c03857ac2b049ac9f02cfe1dde2fba11ea639e191ca6453cb9a6e75cc
          enableCrossOsArchive: true
      - name: Build Windows and installer
        if: matrix.platform == 'windows'
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $repoRoot=$env:GITHUB_WORKSPACE
          & "$repoRoot/windows/build.ps1" -Installer
          Set-Location $repoRoot
          if(-not(Test-Path "$repoRoot/windows/dist/Dedede-Windows-Setup.exe")){throw 'Installer missing.'}
      - name: Test installed Windows files
        if: matrix.platform == 'windows'
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $install=Join-Path $env:RUNNER_TEMP 'Dedede Installer Check'
          $log=Join-Path $env:GITHUB_WORKSPACE 'windows/dist/install-test.log'
          $setup=Start-Process 'windows/dist/Dedede-Windows-Setup.exe' -ArgumentList '/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART','/SP-','/TASKS=desktopicon',('/DIR="'+$install+'"'),('/LOG="'+$log+'"') -PassThru
          if(-not $setup.WaitForExit(180000)){Stop-Process -Id $setup.Id -Force;throw 'Installer timeout.'}
          if($setup.ExitCode -notin @(0,3010)){throw "Installer exit code $($setup.ExitCode)"}
          & "$install/Dedede-Launcher.exe" --check-runtime
          if($LASTEXITCODE -ne 0){throw 'Installed runtime check failed.'}
          foreach($binary in @('Dedede.exe','Dedede-Launcher.exe')){
            $bytes=[IO.File]::ReadAllBytes((Join-Path $install $binary))
            $pe=[BitConverter]::ToInt32($bytes,0x3c)
            if([BitConverter]::ToUInt16($bytes,$pe+24+68) -ne 2){throw "$binary must use GUI subsystem, never console."}
          }
          $shellObject=New-Object -ComObject WScript.Shell
          $link=$shellObject.CreateShortcut((Join-Path ([Environment]::GetFolderPath('Desktop')) '纠错 Pro.lnk'))
          if($link.TargetPath -ne (Join-Path $install 'Dedede-Launcher.exe') -or $link.IconLocation -notmatch 'assets[\\/]app\.ico,0$'){throw 'Installed desktop shortcut target/icon is incorrect.'}
          $report=Join-Path $env:GITHUB_WORKSPACE 'windows/dist/installed-smoke.json' 
          $app=Start-Process "$install/Dedede-Launcher.exe" -ArgumentList '--safe-render','--smoke-test',('"'+$report+'"') -PassThru
          if(-not $app.WaitForExit(180000)){Stop-Process -Id $app.Id -Force;throw 'Installed app timeout.'}
          if($app.ExitCode -ne 0 -or -not(Test-Path $report) -or -not((Get-Content $report -Raw|ConvertFrom-Json).passed)){throw 'Installed model/OCR check failed.'}
      - name: Render actual Windows UI
        if: matrix.platform == 'windows'
        shell: pwsh
        run: |
          $out=Join-Path $env:GITHUB_WORKSPACE 'windows/dist/previews'
          $app=Start-Process 'windows/dist/Dedede-Windows-x64/Dedede.exe' -ArgumentList '--safe-render','--render-preview',('"'+$out+'"') -PassThru
          if(-not $app.WaitForExit(180000)){Stop-Process -Id $app.Id -Force;throw 'Preview timeout.'}
          if($app.ExitCode -ne 0 -or -not(Test-Path "$out/07-dark.png")){throw 'Windows preview failed.'}
      - name: Build native Mac package, model and OCR checks
        if: matrix.platform == 'macos'
        shell: bash
        run: bash macos/build.sh "${{ matrix.rid }}"
      - name: Stage installer
        shell: bash
        run: |
          mkdir -p delivery
          if [[ '${{ matrix.platform }}' == windows ]]; then
            cp windows/dist/Dedede-Windows-Setup.exe delivery/
            cp windows/dist/Dedede-Windows-Setup.zip delivery/
          else
            cp "macos/dist/Dedede-Mac-${{ matrix.label }}.dmg" delivery/
            cp "macos/dist/Dedede-Mac-${{ matrix.label }}.zip" delivery/
          fi
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: Installer-${{ matrix.label }}
          path: delivery/*
          if-no-files-found: error
          retention-days: 30
          compression-level: 0
      - name: Upload diagnostics and real UI previews
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: Checks-and-previews-${{ matrix.label }}
          path: |
            windows/dist/*.json
            windows/dist/*.log
            windows/dist/previews/
            macos/dist/*.json
            macos/dist/previews-*/
          if-no-files-found: ignore
          retention-days: 14
  publish:
    name: Publish desktop installers
    needs: build
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: Installer-*
          path: installers
          merge-multiple: true
      - name: Publish direct downloads
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          cat > windows-notes.md <<'NOTES'
          Windows 10/11 x64 离线安装程序。EXE 可直接安装；ZIP 内为同一完整安装程序，便于分享，解压后安装。当前用户安装，提供启动诊断与兼容启动。未经商业代码签名；云端检查不等于所有电脑实测。
          NOTES
          cat > macos-notes.md <<'NOTES'
          macOS 14+，Apple Silicon 与 Intel 原生包。可下载 DMG，或下载 ZIP 后解压出同一 DMG。拖入 Applications 安装；采用本机签名，尚未 Apple 公证，首次启动可能被系统拦截。OCR 在本机处理。
          NOTES
          if gh release view windows-latest --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload windows-latest installers/Dedede-Windows-Setup.exe installers/Dedede-Windows-Setup.zip --repo "$GITHUB_REPOSITORY" --clobber
            gh release edit windows-latest --repo "$GITHUB_REPOSITORY" --notes-file windows-notes.md
          else
            gh release create windows-latest installers/Dedede-Windows-Setup.exe installers/Dedede-Windows-Setup.zip --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --title '纠错 Pro Windows（最新版）' --notes-file windows-notes.md --latest
          fi
          if gh release view macos-latest --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload macos-latest installers/Dedede-Mac-*.dmg installers/Dedede-Mac-*.zip --repo "$GITHUB_REPOSITORY" --clobber
            gh release edit macos-latest --repo "$GITHUB_REPOSITORY" --notes-file macos-notes.md
          else
            gh release create macos-latest installers/Dedede-Mac-*.dmg installers/Dedede-Mac-*.zip --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --title '纠错 Pro Mac（最新版）' --notes-file macos-notes.md --latest=false
          fi
