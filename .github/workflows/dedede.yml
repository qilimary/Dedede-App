name: Android - 纠错 Pro

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - dedede-build.sh
      - app_icon.png
      - lan.png
      - '错别字.txt'
      - terms.txt
      - pinyin.txt
      - '成语.txt'
      - .github/workflows/dedede.yml

permissions:
  contents: write

concurrency:
  group: dedede-android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 90

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Java 17
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        with:
          gradle-version: '8.14.3'

      # 修复：旧 SDK tools 包已经下架
      - name: Set up Android SDK
        uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4
        with:
          cmdline-tools-version: '14742923'
          packages: 'platform-tools'

      - name: Install Android SDK packages
        run: |
          sdkmanager --install "platforms;android-36" "build-tools;36.0.0" "ndk;27.0.12077973" "cmake;3.22.1"

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.11'

      - name: Regression check for shared proofreading rules
        shell: bash
        run: |
          set -euo pipefail
          python dedede-windows.py
          args=()
          if [ -f 成语.txt ]; then args=(--idioms 成语.txt); fi
          python windows/tests/check_proofreading_java.py "${args[@]}"

      - name: Cache verified models
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .model-cache-pte
          key: dedede-hcam-pte-15b431068a31ff6c9483ca8df5e0d095c6dbdb0b53f80ea9dd98d9d7d9361b6a

      - name: Install build dependencies
        run: python -m pip install gdown==5.2.0 pycryptodome==3.20.0

      # 若在仓库 Secrets 中配置了固定发布签名密钥，则启用固定签名以支持覆盖升级不丢数据；
      # 未配置时自动回退到 debug 签名，不影响正常构建。
      - name: Configure persistent release keystore (optional)
        shell: bash
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          if [[ -n "$ANDROID_KEYSTORE_BASE64" && -n "$ANDROID_KEYSTORE_PASSWORD" && -n "$ANDROID_KEY_ALIAS" ]]; then
            ks="$RUNNER_TEMP/dedede-release.jks"
            printf '%s' "$ANDROID_KEYSTORE_BASE64" | tr -d '[:space:]' | base64 -d > "$ks"
            test -s "$ks"
            key_pass="${ANDROID_KEY_PASSWORD:-$ANDROID_KEYSTORE_PASSWORD}"
            echo "::add-mask::$key_pass"
            {
              echo "DEDEDE_KEYSTORE_PATH=$ks"
              echo "DEDEDE_KEYSTORE_PASSWORD=$ANDROID_KEYSTORE_PASSWORD"
              echo "DEDEDE_KEY_ALIAS=$ANDROID_KEY_ALIAS"
              echo "DEDEDE_KEY_PASSWORD=$key_pass"
            } >> "$GITHUB_ENV"
            echo "Persistent release signing enabled."
          else
            echo "::notice::未配置固定发布签名 Secrets，本次构建回退为临时 debug 签名。"
          fi

      - name: Build Android APK
        shell: bash
        run: |
          set -euo pipefail
          bash -n dedede-build.sh
          bash dedede-build.sh

      - name: Clean up temporary keystore
        if: always()
        shell: bash
        run: rm -f "$RUNNER_TEMP/dedede-release.jks"

      - name: Verify unified APK
        shell: bash
        run: |
          set -euo pipefail
          zip=dist/Dedede-Pro.zip
          apk=dist/Dedede-Pro.apk
          unzip -tqq "$zip"
          test "$(unzip -Z1 "$zip")" = 'Dedede-Pro.apk'
          unzip -p "$zip" Dedede-Pro.apk > "$apk"
          unzip -tqq "$apk"
          badging=$("$ANDROID_HOME/build-tools/36.0.0/aapt" dump badging "$apk")
          grep -q "^package: name='com.app.dededi.pte'" <<< "$badging"
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --print-certs "$apk"

      - name: Upload APK
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          path: dist/Dedede-Pro.apk
          if-no-files-found: error
          retention-days: 30
          archive: false

      - name: Publish Android download
        if: github.ref == 'refs/heads/main'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag=android-variants-latest
          notes='下载 ZIP 解压安装。点击标题旁的双箭头切换普通版和特供版。'
          if ! gh release view "$tag" >/dev/null 2>&1; then
            gh release create "$tag" --target "$GITHUB_SHA" --title 'Dedede Android' --notes "$notes"
          fi
          gh release upload "$tag" dist/Dedede-Pro.zip --clobber
          gh release edit "$tag" --notes "$notes"
          assets=$(gh release view "$tag" --json assets --jq '.assets[].name')
          for old in Dedede-Normal.zip Dedede-Lan.zip Dedede-Normal.apk Dedede-Lan.apk; do
            if grep -Fxq "$old" <<< "$assets"; then gh release delete-asset "$tag" "$old" --yes; fi
          done
          echo "[下载 Android 版](https://github.com/$GITHUB_REPOSITORY/releases/download/$tag/Dedede-Pro.zip)" >> "$GITHUB_STEP_SUMMARY"
