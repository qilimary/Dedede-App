
name: Android - Normal and Lan

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - dedede-build.sh
      - app_icon.png
      - lan.png
      - '错别字.txt'
      - .github/workflows/dedede.yml

permissions:
  contents: write

concurrency:
  group: dedede-android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14.3'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: |
          sdkmanager --install "platforms;android-36" "build-tools;36.0.0" "ndk;27.0.12077973" "cmake;3.22.1"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Cache verified models
        uses: actions/cache@v4
        with:
          path: .model-cache-pte
          key: dedede-hcam-pte-15b431068a31ff6c9483ca8df5e0d095c6dbdb0b53f80ea9dd98d9d7d9361b6a

      - name: Install build dependencies
        run: |
          python -m pip install gdown==5.2.0 pycryptodome==3.20.0

      # 构建模式由 dedede-build.sh 中的 BUILD_MODE 控制
      # normal = 普通版
      # lan    = 兰特供版
      # both   = 双版本
      - name: Build Android
        shell: bash
        run: |
          set -euo pipefail
          bash -n dedede-build.sh
          bash dedede-build.sh

      - name: Verify APK and ZIP files
        shell: bash
        run: |
          set -euo pipefail

          mode=$(awk -F= '/^BUILD_MODE=/{print $2;exit}' dedede-build.sh)
          mode="${mode%%#*}"
          mode="${mode//[[:space:]]/}"

          case "$mode" in
            normal) variants=(Normal) ;;
            lan) variants=(Lan) ;;
            both) variants=(Normal Lan) ;;
            *)
              echo "Invalid BUILD_MODE: $mode"
              exit 1
              ;;
          esac

          shopt -s nullglob
          apks=(dist/*.apk)

          if [[ ${#apks[@]} -ne ${#variants[@]} ]]; then
            echo "APK count mismatch."
            ls -lah dist/ || true
            exit 1
          fi

          for variant in "${variants[@]}"; do
            apk="dist/Dedede-${variant}.apk"
            zip="dist/Dedede-${variant}.zip"

            test -s "$apk"
            test -s "$zip"

            unzip -tqq "$apk"
            unzip -tqq "$zip"

            entries=$(unzip -Z1 "$apk")
            grep -qx 'AndroidManifest.xml' <<< "$entries"
            grep -Eq '^classes([0-9]+)?\.dex$' <<< "$entries"

            echo "Verified: $apk"
          done

      # Actions 备用压缩包
      - name: Upload Android artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Dedede-Android-APKs
          path: dist/*
          if-no-files-found: error
          retention-days: 30

      # Releases 发布独立 APK 和 ZIP
      - name: Publish APK downloads
        if: github.ref == 'refs/heads/main'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          tag="android-variants-latest"

          if ! gh release view "$tag" >/dev/null 2>&1; then
            gh release create "$tag" \
              --target "$GITHUB_SHA" \
              --title "Dedede Android" \
              --notes "普通版与兰特供版。APK 可直接安装，ZIP 为备用压缩包。"
          fi

          for asset in \
            Dedede-Normal.apk \
            Dedede-Lan.apk \
            Dedede-Normal.zip \
            Dedede-Lan.zip
          do
            gh release delete-asset "$tag" "$asset" \
              --yes >/dev/null 2>&1 || true
          done

          gh release upload "$tag" dist/* --clobber

          echo "Android APKs published successfully."
