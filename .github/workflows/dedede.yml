
name: Android - Normal and Lan

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - dedede-build.sh
      - dedede-windows.py
      - app_icon.png
      - lan.png
      - '错别字.txt'
      - '成语.txt'
      - .github/workflows/dedede.yml

permissions:
  contents: write

concurrency:
  group: dedede-android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 90

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Java 17
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        with:
          gradle-version: '8.14.3'

      # 修复：旧 SDK tools 包已经下架
      - name: Set up Android SDK
        uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4
        with:
          cmdline-tools-version: '14742923'
          packages: 'platform-tools'

      - name: Install Android SDK packages
        run: |
          sdkmanager --install "platforms;android-36" "build-tools;36.0.0" "ndk;27.0.12077973" "cmake;3.22.1"

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.11'

      - name: Regression check for Android parser, defaults and shared rules
        shell: bash
        run: |
          set -euo pipefail
          python dedede-windows.py
          args=()
          if [ -f 成语.txt ]; then args=(--idioms 成语.txt); fi
          python windows/tests/check_proofreading_java.py "${args[@]}"

      - name: Cache verified models
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .model-cache-pte
          key: dedede-hcam-pte-15b431068a31ff6c9483ca8df5e0d095c6dbdb0b53f80ea9dd98d9d7d9361b6a

      - name: Install build dependencies
        run: python -m pip install gdown==5.2.0 pycryptodome==3.20.0

      # 版本选择仍由 SH 中的 BUILD_MODE 控制
      # normal = 普通版
      # lan    = 兰特供版
      # both   = 两个版本
      - name: Build Android versions
        shell: bash
        run: |
          set -euo pipefail
          bash -n dedede-build.sh
          bash dedede-build.sh

      - name: Verify selected APK and ZIP files
        id: verify
        shell: bash
        run: |
          set -euo pipefail
          mode=$(sed -n 's/^BUILD_MODE=\([^[:space:]#]*\).*/\1/p' dedede-build.sh | head -n 1)
          case "$mode" in
            normal) versions=(Normal) ;;
            lan)    versions=(Lan) ;;
            both)   versions=(Normal Lan) ;;
            *) echo "Unknown BUILD_MODE: $mode" >&2; exit 1 ;;
          esac

          shopt -s nullglob
          apks=(dist/*.apk)
          test "${#apks[@]}" -eq "${#versions[@]}"

          for version in "${versions[@]}"; do
            apk="dist/Dedede-${version}.apk"
            zip="dist/Dedede-${version}.zip"

            test -s "$apk"
            test -s "$zip"
            unzip -tqq "$apk"
            unzip -tqq "$zip"

            contents=$(unzip -Z1 "$apk")
            grep -qx 'AndroidManifest.xml' <<< "$contents"
            grep -Eq '^classes([0-9]+)?\.dex$' <<< "$contents"

            expected=com.app.dededi.pte
            if [[ "$version" == Lan ]]; then expected="$expected.lan"; fi
            actual=$("$ANDROID_HOME/build-tools/36.0.0/aapt" dump badging "$apk" | sed -n "s/^package: name='\([^']*\)'.*/\1/p")
            test "$actual" = "$expected"
            echo "${version,,}=true" >> "$GITHUB_OUTPUT"
            echo "Verified $apk and $zip ($actual)"
          done

      - name: Upload Normal APK
        if: steps.verify.outputs.normal == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: Dedede-Normal-APK
          path: dist/Dedede-Normal.apk
          if-no-files-found: error
          retention-days: 30
          compression-level: 0

      - name: Upload Normal ZIP
        if: steps.verify.outputs.normal == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: Dedede-Normal-ZIP
          path: dist/Dedede-Normal.zip
          if-no-files-found: error
          retention-days: 30
          compression-level: 0

      - name: Upload Lan APK
        if: steps.verify.outputs.lan == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: Dedede-Lan-APK
          path: dist/Dedede-Lan.apk
          if-no-files-found: error
          retention-days: 30
          compression-level: 0

      - name: Upload Lan ZIP
        if: steps.verify.outputs.lan == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: Dedede-Lan-ZIP
          path: dist/Dedede-Lan.zip
          if-no-files-found: error
          retention-days: 30
          compression-level: 0

      - name: Publish directly downloadable APKs
        if: github.ref == 'refs/heads/main'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag=android-variants-latest

          if ! gh release view "$tag" >/dev/null 2>&1; then
            gh release create "$tag" --target "$GITHUB_SHA" --title 'Dedede Android' --notes '普通版与兰特供版可独立安装，数据互不影响；APK 可直接安装，ZIP 为备用包。'
          fi

          # Replace selected assets first; keep the previous release if upload fails.
          gh release upload "$tag" dist/* --clobber
          for asset in Dedede-Normal.apk Dedede-Lan.apk Dedede-Normal.zip Dedede-Lan.zip; do
            if [[ ! -f "dist/$asset" ]]; then
              gh release delete-asset "$tag" "$asset" --yes >/dev/null 2>&1 || true
            fi
          done
          {
            echo '### Android 下载'
            echo '普通版与兰特供版可同时安装；点击 APK 链接直接下载，ZIP 为备用。'
            for file in dist/*; do
              name=$(basename "$file")
              echo "- [$name](https://github.com/$GITHUB_REPOSITORY/releases/download/$tag/$name)"
            done
          } >> "$GITHUB_STEP_SUMMARY"
