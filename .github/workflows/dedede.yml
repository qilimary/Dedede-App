
name: 纠错 Pro PTE APK
'on':
  workflow_dispatch: {}
  push:
    branches:
    - main
    paths:
    - .github/workflows/dedede.yml
    - dedede-build.sh
    - app_icon.png
    - 错别字.txt
permissions:
  contents: read
concurrency:
  group: dedede-v2-pte-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-python@v5
      with:
        python-version: '3.10'
    - name: Install build dependencies
      run: python -m pip install gdown==5.2.0 pycryptodome==3.20.0
    - uses: actions/cache@v4
      with:
        path: .model-cache-pte
        key: hcam-v2-pte-15b43106-bed43878
    - name: Cache test signing key
      uses: actions/cache@v4
      with:
        path: ~/.android/debug.keystore
        key: dedede-v2-test-signing-pte-v1
    - uses: actions/setup-java@v4
      with:
        distribution: temurin
        java-version: '17'
    - uses: android-actions/setup-android@v4
    - name: Install Android SDK
      run: sdkmanager "platforms;android-36" "build-tools;35.0.0" "ndk;27.0.12077973" "cmake;3.22.1"
    - uses: gradle/actions/setup-gradle@v4
      with:
        gradle-version: '8.13'
        cache-disabled: true
    - name: Build independent PTE app
      shell: bash
      run: bash dedede-build.sh
    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: Dedede-HCAM-V2-PTE
        path: Dedede-HCAM-V2-PTE.apk
        if-no-files-found: error
        retention-days: 30
    - name: Upload failure log
      if: failure()
      uses: actions/upload-artifact@v4
      with:
        name: build-log-pte
        path: build_output.log
        if-no-files-found: ignore
