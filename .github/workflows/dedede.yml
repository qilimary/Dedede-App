
name: Android - Normal and Lan

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - dedede-build.sh
      - app_icon.png
      - lan.png
      - '错别字.txt'
      - .github/workflows/dedede.yml

permissions:
  contents: write

concurrency:
  group: dedede-android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14.3'

      # 修复：旧 SDK tools 包已经下架
      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'

      - name: Install Android SDK packages
        run: |
          sdkmanager --install "platforms;android-36" "build-tools;36.0.0" "ndk;27.0.12077973" "cmake;3.22.1"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Cache verified models
        uses: actions/cache@v4
        with:
          path: .model-cache-pte
          key: dedede-hcam-pte-15b431068a31ff6c9483ca8df5e0d095c6dbdb0b53f80ea9dd98d9d7d9361b6a

      - name: Install build dependencies
        run: python -m pip install gdown==5.2.0 pycryptodome==3.20.0

      # 版本选择仍由 SH 中的 BUILD_MODE 控制
      # normal = 普通版
      # lan    = 兰特供版
      # both   = 两个版本
      - name: Build Android versions
        shell: bash
        run: |
          set -euo pipefail
          bash -n dedede-build.sh
          bash dedede-build.sh

      - name: Verify selected APK and ZIP files
        shell: bash
        run: |
          set -euo pipefail
          mode=$(sed -n 's/^BUILD_MODE=\([^[:space:]#]*\).*/\1/p' dedede-build.sh | head -n 1)
          case "$mode" in
            normal) versions=(Normal) ;;
            lan)    versions=(Lan) ;;
            both)   versions=(Normal Lan) ;;
            *) echo "Unknown BUILD_MODE: $mode" >&2; exit 1 ;;
          esac

          shopt -s nullglob
          apks=(dist/*.apk)
          test "${#apks[@]}" -eq "${#versions[@]}"

          for version in "${versions[@]}"; do
            apk="dist/Dedede-${version}.apk"
            zip="dist/Dedede-${version}.zip"

            test -s "$apk"
            test -s "$zip"
            unzip -tqq "$apk"
            unzip -tqq "$zip"

            contents=$(unzip -Z1 "$apk")
            grep -qx 'AndroidManifest.xml' <<< "$contents"
            grep -Eq '^classes([0-9]+)?\.dex$' <<< "$contents"

            echo "Verified $apk and $zip"
          done

      - name: Upload APKs and ZIPs to Actions
        uses: actions/upload-artifact@v4
        with:
          name: Dedede-Android-APKs
          path: dist/*
          if-no-files-found: error
          retention-days: 30

      - name: Publish directly downloadable APKs
        if: github.ref == 'refs/heads/main'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag=android-variants-latest

          if ! gh release view "$tag" >/dev/null 2>&1; then
            gh release create "$tag" --target "$GITHUB_SHA" --title 'Dedede Android' --notes '普通版与兰特供版；APK 可直接安装，ZIP 为备用包。'
          fi

          for asset in Dedede-Normal.apk Dedede-Lan.apk Dedede-Normal.zip Dedede-Lan.zip; do
            gh release delete-asset "$tag" "$asset" --yes >/dev/null 2>&1 || true
          done

          gh release upload "$tag" dist/* --clobber
