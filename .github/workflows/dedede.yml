name: Android - Normal and Lan

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - dedede-build.sh
      - app_icon.png
      - lan.png
      - '错别字.txt'
      - '成语.txt'
      - .github/workflows/dedede.yml

permissions:
  contents: write

concurrency:
  group: dedede-android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 90

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Java 17
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        with:
          gradle-version: '8.14.3'

      # 修复：旧 SDK tools 包已经下架
      - name: Set up Android SDK
        uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4
        with:
          cmdline-tools-version: '14742923'
          packages: 'platform-tools'

      - name: Install Android SDK packages
        run: |
          sdkmanager --install "platforms;android-36" "build-tools;36.0.0" "ndk;27.0.12077973" "cmake;3.22.1"

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.11'

      - name: Regression check for shared proofreading rules
        shell: bash
        run: |
          set -euo pipefail
          python dedede-windows.py
          args=()
          if [ -f 成语.txt ]; then args=(--idioms 成语.txt); fi
          python windows/tests/check_proofreading_java.py "${args[@]}"

      - name: Cache verified models
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .model-cache-pte
          key: dedede-hcam-pte-15b431068a31ff6c9483ca8df5e0d095c6dbdb0b53f80ea9dd98d9d7d9361b6a

      - name: Install build dependencies
        run: python -m pip install gdown==5.2.0 pycryptodome==3.20.0

      # 版本选择仍由 SH 中的 BUILD_MODE 控制
      # normal = 普通版
      # lan    = 兰特供版
      # both   = 两个版本
      - name: Build Android versions
        shell: bash
        run: |
          set -euo pipefail
          bash -n dedede-build.sh
          bash dedede-build.sh

      # The build script writes one ZIP for the standalone GitHub Release download.
      # Actions itself wraps every artifact in a ZIP, so export its inner APK here.
      - name: Verify ZIP packages and extract APK for Actions artifacts
        id: verify
        shell: bash
        run: |
          set -euo pipefail
          mode=$(sed -n 's/^BUILD_MODE=\([^[:space:]#]*\).*/\1/p' dedede-build.sh | head -n 1)
          case "$mode" in
            normal) versions=(Normal) ;;
            lan)    versions=(Lan) ;;
            both)   versions=(Normal Lan) ;;
            *) echo "Unknown BUILD_MODE: $mode" >&2; exit 1 ;;
          esac
          shopt -s nullglob
          zips=(dist/Dedede-*.zip)
          apks=(dist/Dedede-*.apk)
          test "${#zips[@]}" -eq "${#versions[@]}"
          test "${#apks[@]}" -eq 0
          for version in "${versions[@]}"; do
            zip="dist/Dedede-${version}.zip"
            entry="Dedede-${version}.apk"
            apk="dist/${entry}"
            test -s "$zip"
            unzip -tqq "$zip"
            test "$(unzip -Z1 "$zip" | wc -l)" -eq 1
            unzip -Z1 "$zip" | grep -Fxq "$entry"
            unzip -p "$zip" "$entry" > "$apk"
            test -s "$apk"
            unzip -tqq "$apk"
            contents=$(unzip -Z1 "$apk")
            grep -qx 'AndroidManifest.xml' <<< "$contents"
            grep -Eq '^classes([0-9]+)?\.dex$' <<< "$contents"
            expected=com.app.dededi.pte
            if [[ "$version" == Lan ]]; then expected="$expected.lan"; fi
            actual=$("$ANDROID_HOME/build-tools/36.0.0/aapt" dump badging "$apk" | sed -n "s/^package: name='\([^']*\)'.*/\1/p")
            test "$actual" = "$expected"
            echo "${version,,}=true" >> "$GITHUB_OUTPUT"
            echo "Verified $zip and exported $apk ($actual)"
          done

      # Upload the special edition first, normal edition last: GitHub commonly
      # shows recently uploaded artifacts at the top. Numbered names make
      # the intended order clear independently of the presentation sort.
      - name: Upload Lan APK (one extraction)
        if: steps.verify.outputs.lan == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: 02-Dedede-Lan-APK
          path: dist/Dedede-Lan.apk
          if-no-files-found: error
          retention-days: 30
          compression-level: 0

      - name: Upload Normal APK (one extraction)
        if: steps.verify.outputs.normal == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: 01-Dedede-Normal-APK
          path: dist/Dedede-Normal.apk
          if-no-files-found: error
          retention-days: 30
          compression-level: 0

      - name: Publish directly downloadable ZIPs
        if: github.ref == 'refs/heads/main'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag=android-variants-latest

          if ! gh release view "$tag" >/dev/null 2>&1; then
            gh release create "$tag" --target "$GITHUB_SHA" --title 'Dedede Android' --notes '普通版与兰特供版可独立安装，数据互不影响；下载 ZIP 解压后安装 APK。'
          fi
          # Replace selected assets first; keep the previous release if upload fails.
          gh release upload "$tag" dist/Dedede-*.zip --clobber
          # Old APK download items are not published in Releases.
          for asset in Dedede-Normal.apk Dedede-Lan.apk; do
            gh release delete-asset "$tag" "$asset" --yes >/dev/null 2>&1 || true
          done
          for asset in Dedede-Normal.zip Dedede-Lan.zip; do
            if [[ ! -f "dist/$asset" ]]; then
              gh release delete-asset "$tag" "$asset" --yes >/dev/null 2>&1 || true
            fi
          done
          {
            echo '### Android 下载'
            echo '普通版在前，兰特供版在后。Actions 产物解压一次即可安装 APK；Release ZIP 也只需解压一次。'
            for name in Dedede-Normal.zip Dedede-Lan.zip; do
              if [[ -f "dist/$name" ]]; then
                echo "- [$name](https://github.com/$GITHUB_REPOSITORY/releases/download/$tag/$name)"
              fi
            done
          } >> "$GITHUB_STEP_SUMMARY"
