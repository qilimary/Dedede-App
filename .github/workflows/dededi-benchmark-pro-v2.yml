# Replacement for .github/workflows/dededi-benchmark-pro-v2.yml
# Pushing this file to main triggers the benchmark automatically.
# All benchmark code is embedded below: only ONE file needs replacing.
name: Dedede HCAM V2 Pro Benchmark

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/dededi-benchmark-pro-v2.yml'
      - 'dedede-build.sh'
      - '错别字.txt'
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: dedede-hcam-benchmark-${{ github.ref }}
  cancel-in-progress: false

jobs:
  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      DEDEDI_TEMPERATURE: '1.0'
      DEDEDI_THRESHOLD_DE: '0.70'
      DEDEDI_THRESHOLD_DI: '0.70'
      DEDEDI_THRESHOLD_DE3: '0.75'
      DEDEDI_THRESHOLD_ZUO: '0.75'
      DEDEDI_THRESHOLD_ZUO4: '0.75'
      PYTHONUNBUFFERED: '1'
    steps:
      - name: Check out exact source revision
        uses: actions/checkout@v4
      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Install CPU inference environment
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          # ExecuTorch 1.5.1 Python wheel is linked against PyTorch 2.11 ABI.
          # Pin both; installing torch 2.9 makes executorch's native .so fail to import.
          python -m pip install 'torch==2.11.0' --index-url https://download.pytorch.org/whl/cpu
          python -m pip install 'executorch==1.5.1' 'gdown==5.2.0' 'regex==2024.11.6'
          python - <<'PY_CHECK'
          import importlib.metadata
          import torch
          assert torch.__version__.split('+')[0] == '2.11.0', f'PyTorch 版本不匹配: {torch.__version__}'
          from executorch.runtime import Runtime
          print('PyTorch:', torch.__version__, flush=True)
          print('ExecuTorch:', importlib.metadata.version('executorch'), flush=True)
          backend_names = Runtime.get().backend_registry.backend_names
          print('Available ExecuTorch backends:', backend_names, flush=True)
          if 'XnnpackBackend' not in backend_names:
              raise RuntimeError('当前 ExecuTorch wheel 未提供 XNNPACK，不能加载 Android PTE 模型')
          print('ExecuTorch ABI and XNNPACK smoke-check passed', flush=True)
          PY_CHECK
      - name: Download the original benchmark datasets
        shell: bash
        run: |
          set -euo pipefail
          git clone --depth 1 https://github.com/zejunwang1/CTCDataset.git .benchmark-data
          test -s .benchmark-data/NLPCC2023/spell/data.jsonl
          test -s .benchmark-data/yacsc/sighan_revised/test_sighan15.jsonl
      - name: Run benchmark and publish the scores to run summary
        shell: bash
        run: |
          set -euo pipefail
          cat > /tmp/dedede_hcam_benchmark.py <<'PY'
          import argparse
          import hashlib
          import json
          import math
          import os
          import random
          import re
          import subprocess
          import sys
          import time
          from dataclasses import dataclass
          from pathlib import Path
          
          import regex as jregex
          
          ROOT = Path.cwd()
          APP_SOURCE_PATH = ROOT / 'dedede-build.sh'
          DATA_ROOT = ROOT / '.benchmark-data'
          MODEL_ROOT = ROOT / '.benchmark-pro-model'
          TYPO_FILE = ROOT / '错别字.txt'
          LABELS = '的地得做作'
          RNG = random.Random(20260807)
          TEMPERATURE = float(os.getenv('DEDEDI_TEMPERATURE', '1.0'))
          THRESHOLDS = {k: float(os.getenv('DEDEDI_THRESHOLD_' + name, str(default)))
                        for k, name, default in [('的','DE',.7),('地','DI',.7),('得','DE3',.75),('做','ZUO',.75),('作','ZUO4',.75)]}
          if not 0.5 <= TEMPERATURE <= 2.0 or any(not 0.0 <= x <= 1.0 for x in THRESHOLDS.values()):
              raise ValueError('温度或阈值超出 APP 允许范围')
          
          
          def verify_and_download():
              source = APP_SOURCE_PATH.read_text(encoding='utf-8')
              MODEL_ROOT.mkdir(exist_ok=True)
              for key, filename in [('MODEL', 'model.pte'), ('TOKENIZER', 'tokenizer.json')]:
                  def lookup(suffix):
                      found = re.search(r"(?m)^" + key + suffix + r"='([^']+)'", source)
                      if found is None:
                          raise RuntimeError('当前 Android 构建脚本缺少 ' + key + suffix)
                      return found.group(1)
                  expected = lookup('_SHA')
                  target = MODEL_ROOT / filename
                  if not target.is_file() or hashlib.sha256(target.read_bytes()).hexdigest() != expected:
                      subprocess.run([sys.executable, '-m', 'gdown', lookup('_ID'), '--no-cookies', '-O', str(target)], check=True)
                  sha = hashlib.sha256(target.read_bytes()).hexdigest()
                  if sha != expected:
                      raise RuntimeError(f'{filename} 校验失败: {sha}, 预期 {expected}')
                  print(f'资源已校验: {filename}, {target.stat().st_size:,} bytes, {sha}', flush=True)
              return source
          
          
          def java_string(raw):
              return json.loads('"' + raw + '"')
          
          
          def extract_constants(source):
              def const(name):
                  m = re.search(r'public static final String ' + re.escape(name) + r' = "((?:\\.|[^"\\])*)";', source)
                  if m is None:
                      raise RuntimeError('当前 Java 源码缺少常量 ' + name)
                  return java_string(m.group(1))
              def string_array(name):
                  m = re.search(r'public static final String\[\] ' + re.escape(name) + r' = \{(.*?)\};', source, re.S)
                  if m is None:
                      raise RuntimeError('当前 Java 源码缺少词表 ' + name)
                  return [java_string(x) for x in re.findall(r'"((?:\\.|[^"\\])*)"', m.group(1))]
              match = re.search(r'public static boolean isSafeCharAfterNoun\(char c\).*?return "((?:\\.|[^"\\])*)"\.indexOf\(c\) >= 0;', source, re.S)
              if not match:
                  raise RuntimeError('无法读取量词规则安全后缀')
              return const('NUMS'), const('KNOWN_QUANTS'), string_array('IGNORE_WORDS'), string_array('WHITE_LIST'), java_string(match.group(1))
          
          
          @dataclass
          class Rule:
              regex: object
              options: list
              raw: str
          
          
          def extract_rules(source):
              start = source.index('public static synchronized void ensureRulesLoaded()')
              end = source.index('} catch (Throwable error) { rulesAttempted=false;', start)
              body = source[start:end]
              vars_ = {name: java_string(raw) for name, raw in re.findall(
                  r'\bString\s+([A-Za-z_]\w*)\s*=\s*"((?:\\.|[^"\\])*)";', body)}
              arrays = {name: [java_string(x) for x in re.findall(r'"((?:\\.|[^"\\])*)"', raw)]
                        for name, raw in re.findall(r'\bString\[\]\s+([A-Za-z_]\w*)\s*=\s*\{(.*?)\};', body, re.S)}
              rules = []
              def add(pattern, options):
                  try:
                      compiled = jregex.compile(pattern)
                  except Exception as e:
                      raise RuntimeError('当前 Java 正则无法在 Python 中编译: ' + pattern) from e
                  if compiled.groups < 3:
                      raise RuntimeError('语法规则必须有 3 个捕获组: ' + pattern)
                  rules.append(Rule(compiled, options, pattern))
              def options_from_line(line):
                  m = re.search(r',\s*new String\[\]\[\]\{(.*)\}\);', line)
                  if not m:
                      raise RuntimeError('语法规则选项格式已变化: ' + line[:150])
                  groups = re.findall(r'\{([^{}]*)\}', m.group(1))
                  options = [[None if k == 'null' else java_string(k[1:-1])
                              for k in re.findall(r'null|"(?:\\.|[^"\\])*"', group)] for group in groups]
                  if not options:
                      raise RuntimeError('语法规则缺少候选: ' + line[:150])
                  return options
              def eval_concat(expr):
                  result = []
                  token = re.compile(r'\s*(?:"((?:\\.|[^"\\])*)"|([A-Za-z_]\w*))\s*(?:\+|$)')
                  pos = 0
                  while pos < len(expr):
                      m = token.match(expr, pos)
                      if not m:
                          raise RuntimeError('无法读取动态规则字符串: ' + expr)
                      if m.group(1) is not None:
                          result.append(java_string(m.group(1)))
                      else:
                          result.append(vars_[m.group(2)])
                      pos = m.end()
                  return ''.join(result)
              # Preserve registration order exactly. APP resolves overlapping rules by
              # the first registered match, so appending synthesized loop rules at the
              # end (as the previous benchmark did) would silently change behavior.
              loop_counts = {name: 0 for name in ('quantifiers', 'weekdays', 'lunarDays', 'simple', 'point', 'floor', 'class')}
              need = ['quantifiers','chineseNumbers','weekdays','lunarDays','simple']
              if any(k not in vars_ and k not in arrays for k in need):
                  raise RuntimeError('动态数字规则变量缺失')
              for line in body.splitlines():
                  item = line.strip()
                  if item.startswith(('addRule(', 'addProfessionalRule(')):
                      after = item.split('(', 1)[1]
                      if ', new String[][]' not in after:
                          raise RuntimeError('语法规则格式不支持: ' + item[:150])
                      add(eval_concat(after.split(', new String[][]', 1)[0]), options_from_line(item))
                      continue
                  if not item.startswith('for (int i =') or 'addRule(' not in item:
                      continue
                  if 'chineseNumbers[i]' in item:
                      loop_counts['quantifiers'] += 1
                      for i in range(1,11):
                          add(rf'(?<![0-9a-zA-Z.])({i})( *)({vars_["quantifiers"]})', [[arrays['chineseNumbers'][i], None]])
                  elif 'weekdays[i]' in item:
                      loop_counts['weekdays'] += 1
                      for i in range(1,8):
                          add(rf'(星期|周|礼拜)( *)({i})(?![0-9])', [[None, arrays['weekdays'][i]]])
                  elif 'lunarDays[i]' in item:
                      loop_counts['lunarDays'] += 1
                      for i in range(1,31):
                          add(rf'(正月|腊月|冬月)( *)({i})(?![0-9])', [[None, arrays['lunarDays'][i]]])
                  elif 'simple[i]' in item:
                      if '(初)' in item:
                          key,tail,stop='simple','初',r'(?![0-9])'
                          for i in range(1,11):
                              add(rf'(初)( *)({i}){stop}',[[None,arrays['simple'][i]]])
                      elif '(点|点钟)' in item:
                          key='point'
                          for i in range(1,10):
                              add(rf'(?<![0-9])({i})()(点|点钟)(?![0-9分秒])',[[arrays['simple'][i],None]])
                      elif '(楼|层)' in item:
                          key='floor'
                          for i in range(1,10):
                              add(rf'(?<![0-9])({i})()(楼|层)(?![0-9])',[[arrays['simple'][i],None]])
                      elif '(班)' in item:
                          key='class'
                          for i in range(1,10):
                              add(rf'(?<![0-9])({i})()(班)(?![0-9])',[[arrays['simple'][i],None]])
                      else:
                          raise RuntimeError('未知的动态 simple[i] 规则: ' + item[:120])
                      loop_counts[key] += 1
                  else:
                      raise RuntimeError('新增的 APP 动态语法规则暂不支持：' + item[:150])
              if any(count != 1 for count in loop_counts.values()) or len(rules) < 250:
                  raise RuntimeError(f'APP 规则不完整：动态规则={loop_counts}，总规则={len(rules)}')
          
              protected = []
              for raw in re.findall(r'(?m)^\s*addProtectedTargetPattern\("((?:\\.|[^"\\])*)"\);', body):
                  pat = jregex.compile(java_string(raw))
                  if pat.groups < 1:
                      raise RuntimeError('目标保护正则无捕获组')
                  protected.append(pat)
              if len(protected) < 50:
                  raise RuntimeError(f'只找到 {len(protected)} 条保护正则')
              quant = {noun: (java_string(primary), java_string(allowed))
                       for noun, primary, allowed in re.findall(
                           r'quantRules\.put\(\'(.?)\',\s*new QuantifierRule\("((?:\\.|[^"\\])*)",\s*"((?:\\.|[^"\\])*)"\)\)', body)}
              if len(quant) < 10:
                  raise RuntimeError('量词规则未正确解析')
              return rules, protected, quant
          
          
          class Dictionary:
              def __init__(self, words, whites, exclusions):
                  self.words, self.whites, self.exclusions = words, whites, exclusions
                  self.lengths = {}
                  for key in words:
                      self.lengths.setdefault(key[0], set()).add(len(key))
                  self.lengths = {k: sorted(v, reverse=True) for k, v in self.lengths.items()}
                  self.max_len = max(map(len, words))
          
              def excluded(self, text, index, word):
                  end = index + len(word)
                  for guard in self.exclusions.get(word, ()):
                      found = text.find(guard, max(0, end-len(guard)))
                      if found >= 0 and found <= index and found + len(guard) >= end:
                          return True
                  return False
          
              def conflicts(self, sentence, index, source, correction):
                  if source == correction:
                      return False
                  simulated = sentence[:index] + correction + sentence[index+len(source):]
                  end = index+len(correction)
                  for cursor in range(max(0,index-self.max_len+1),end):
                      if cursor >= len(simulated):
                          break
                      for n in self.lengths.get(simulated[cursor], ()):
                          cand = simulated[cursor:cursor+n]
                          if len(cand) != n or cand not in self.words:
                              continue
                          if not ((cursor < index and cursor+n > index) or cursor+n > end):
                              continue
                          if cand != self.words[cand] and not self.excluded(simulated,cursor,cand):
                              return True
                  return False
          
              def find(self, text, index):
                  for n in self.lengths.get(text[index], ()):
                      key = text[index:index+n]
                      if key not in self.words:
                          continue
                      if any(start < index+n and start+len(white) > index
                             for white in self.whites if white
                             for start in self._find_all(text, white, max(0, index-len(white)), min(len(text), index+n+len(white)))):
                          continue
                      if key[0] in '做作':
                          if index > 0 and text[index-1] in '创去要在该想会能可来把给多没不曾刚才将正就爱肯敢配帮替让叫使令':
                              continue
                          if index+n < len(text) and text[index+n] in '扇筝联山发牙眼肢手脚衣裤帽鞋饭菜汤了':
                              continue
                      replacement = self.words[key]
                      if self.excluded(text,index,key):
                          return key,key  # APP's neutral protected match, not a skip.
                      if replacement != key and self.conflicts(text,index,key,replacement):
                          continue
                      return key, replacement
                  return None
          
              @staticmethod
              def _find_all(text, needle, left, right):
                  if not needle:
                      return
                  pos = text.find(needle, left, right)
                  while pos >= 0:
                      yield pos
                      pos = text.find(needle, pos+1, right)
          
          
          def load_dictionary(white):
              # Mirror Android parseTypoLine, including n= exclusion fields and
              # supplemental safe-context entries; source==target text lines are ignored.
              data, exclusions = {}, {}
              for raw in TYPO_FILE.read_text(encoding='utf-8-sig').splitlines():
                  line = raw.strip().lstrip('\ufeff').strip()
                  parts = re.split(r'\s+', line, maxsplit=2)
                  if len(parts) < 2 or parts[0] == parts[1]:
                      continue
                  source,target = parts[:2]
                  data[source] = target
                  exclusions.pop(source,None)
                  if len(parts)==3 and parts[2].startswith('n='):
                      tail = parts[2][2:].strip()
                      if tail: exclusions[source] = tail.split()
                  boundary = {
                      ('妨照','仿照'): ['不妨照'],
                      ('换界','换届'): ['换界面'],
                      ('做数','作数'): ['做数学','做数据','做数值','做数理','做数独','做数字','做数量','做数组']
                  }.get((source,target))
                  if boundary:
                      exclusions[source] = list(dict.fromkeys(list(exclusions.get(source, ())) + boundary))
              for word in ('舒的','怎的','能的','您的'):
                  data[word] = word
                  exclusions.pop(word,None)
              if not data:
                  raise RuntimeError('系统错词库为空')
              return Dictionary(data, white, exclusions)
          
          
          def split_text(text):
              parts, current = [], ''
              for c in text:
                  current += c
                  if c in '。！？!?\n':
                      parts.append(current)
                      current = ''
              if current:
                  parts.append(current)
              result = []
              for part in parts:
                  if len(part) <= 300:
                      result.append(part)
                      continue
                  pending = ''
                  for c in part:
                      pending += c
                      if len(pending) < 300:
                          continue
                      cut = max((pending.rfind(q, max(0, len(pending)-60)) for q in '，,；;、'), default=-1)
                      if cut > 0:
                          result.append(pending[:cut+1]); pending = pending[cut+1:]
                      else:
                          result.append(pending); pending = ''
                  if pending:
                      result.append(pending)
              return result
          
          
          class Pipeline:
              def __init__(self, rules, protected, quant, words, nums, known, ignore, safe):
                  self.rules, self.protected, self.quant, self.words = rules, protected, quant, words
                  self.nums, self.known, self.ignore, self.safe = nums, known, ignore, safe
          
              def preprocess(self, sentence):
                  hits = [None] * len(sentence)
                  for rule in self.rules:
                      for m in rule.regex.finditer(sentence, overlapped=True):
                          p = m.start()
                          if p < len(hits) and hits[p] is None:
                              hits[p] = (m.end(), tuple(m.group(i) or '' for i in (1,2,3)), rule.options)
                  out, ignored, p = [], [], 0
                  def append(value, protect=False):
                      out.append(value)
                      ignored.extend([protect] * len(value))
                  while p < len(sentence):
                      found = self.words.find(sentence, p)
                      if found:
                          source, replacement = found
                          append(replacement, protect=True)
                          p += len(source)
                          continue
                      match = hits[p]
                      if match:
                          end, (g1, g2, g3), options = match
                          selected = RNG.choice(options)
                          a = selected[0] if len(selected) > 0 and selected[0] is not None else g1
                          c = selected[1] if len(selected) > 1 and selected[1] is not None else g3
                          # APP has a special overlapping "2个电脑" grammatical precedence rule.
                          if g3 == '个' and c == '个' and end > 0 and hits[end-1]:
                              h = hits[end-1]
                              if h[1][0] == '个' and h[1][1] == '' and h[1][2] == '电脑' and h[2][0][0] == '台':
                                  c = '台'
                          appendix = len(selected) > 2 and selected[2] is not None and selected[2] != ''
                          if (len(selected)>2 and selected[2]=='标点多余' and not g2 and
                              ((re.fullmatch(r'[，、]+',g1) and re.fullmatch(r'[。；：]',g3)) or
                               (re.fullmatch(r'[。；：]',g1) and re.fullmatch(r'[，、]+',g3))) and
                              (not a) != (not c)):
                              kept = c if not a else a
                              if len(kept)>1 and re.fullmatch(r'[，、]+',kept):
                                  kept=kept[0]
                              append(kept, protect=True)
                              p=end
                              continue
                          append(a, protect=(g1 != a or appendix and selected[0] is not None))
                          append(g2)
                          append(c, protect=(g3 != c or appendix and len(selected)>1 and selected[1] is not None))
                          p = end
                          continue
                      if 0 < p < len(sentence)-1 and sentence[p] in self.known and sentence[p-1] in self.nums:
                          noun = sentence[p+1]
                          if noun in self.quant:
                              primary, allowed = self.quant[noun]
                              following = sentence[p+2] if p+2 < len(sentence) else '\0'
                              if sentence[p] not in allowed and (following == '\0' or not ('\u4e00' <= following <= '\u9fff') or following in self.safe):
                                  append(primary, protect=True); p += 1; continue
                      append(sentence[p]); p += 1
                  result = ''.join(out)
                  for word in self.ignore:
                      for p in Dictionary._find_all(result, word, 0, len(result)):
                          ignored[p:p+len(word)] = [True]*len(word)
                  for pattern in self.protected:
                      for match in pattern.finditer(result):
                          p = match.start(1)
                          if p >= 0 and p < len(ignored) and result[p] in LABELS:
                              ignored[p] = True
                  if len(result) != len(ignored):
                      raise RuntimeError('预处理保护索引长度不符')
                  return result, ignored
          
          
          class HcamModel:
              def __init__(self):
                  import torch
                  from executorch.runtime import Runtime
                  self.torch = torch
                  torch.set_num_threads(min(4, os.cpu_count() or 1))
                  data = json.loads((MODEL_ROOT / 'tokenizer.json').read_text(encoding='utf-8'))
                  if data.get('format') != 'HCAM-character-latin-bpe-tokenizer' or data.get('version') != 6:
                      raise RuntimeError('Tokenzier 格式错误')
                  pieces = data['pieces']
                  if len(pieces) != 23000:
                      raise RuntimeError('Tokenzier 词表长度异常')
                  self.vocab = {piece: i for i, piece in enumerate(pieces)}
                  if [self.vocab[x] for x in LABELS] != [472,510,561,724,496]:
                      raise RuntimeError('目标标签 ID 与 Android 不一致')
                  self.latin = json.loads(data['latin_bpe_json'])['model']
                  self.latin_vocab = set(self.latin['vocab'])
                  self.ranks = {}
                  for i, pair in enumerate(self.latin['merges']):
                      left, right = pair if isinstance(pair, list) else pair.split(' ', 1)
                      self.ranks[left+'\0'+right] = i
                  self.pattern = jregex.compile(r'\p{Script=Latin}[\p{Script=Latin}\p{M}]*')
                  self.program = Runtime.get().load_program(MODEL_ROOT / 'model.pte')
                  self.forward_method = self.program.load_method('forward')
                  self.calls = 0
                  self.reviews = 0
          
              def latin_parts(self, raw):
                  cased = [c for c in raw if c.lower()!=c.upper()]
                  upper = any(c.isupper() for c in cased)
                  lower = any(c.islower() for c in cased)
                  title = bool(cased) and cased[0].isupper() and all(c.islower() for c in cased[1:])
                  keep = (len(cased)==1 and upper) or (upper and not lower) or (upper and lower and not title)
                  normalized = raw if keep else ''.join(c.lower() if len(c.lower())==1 else c for c in raw)
                  parts = list(normalized)
                  fallback = len(parts)>128 or any(c not in self.latin_vocab for c in parts)
                  if not fallback:
                      while len(parts)>1:
                          best=(10**10,-1)
                          for i in range(len(parts)-1):
                              rank=self.ranks.get(parts[i]+'\0'+parts[i+1],10**10)
                              if rank<best[0]: best=(rank,i)
                          if best[1]<0: break
                          i=best[1]; parts[i:i+2]=[parts[i]+parts[i+1]]
                      fallback = any(piece not in self.vocab for piece in parts)
                  return list(normalized) if fallback else parts
          
              def encode(self, text):
                  ids, starts, ends = [], [], []
                  p=0
                  while p<len(text):
                      start=p
                      if text.startswith(('<用户>','<助手>'),p):
                          special=4 if text.startswith('<用户>',p) else 5
                          p+=4
                      elif text[p] in '\r\n\u2028\u2029':
                          count=0
                          while p<len(text) and text[p] in '\r\n\u2028\u2029':
                              if text[p:p+2]=='\r\n': p+=2
                              else: p+=1
                              count+=1
                          special=7 if count>=2 else 6
                      else:
                          latin=self.pattern.match(text,p)
                          if latin:
                              for piece in self.latin_parts(latin.group()):
                                  nxt=p+len(piece)
                                  ids.append(self.vocab.get(piece,0)); starts.append(p); ends.append(nxt)
                                  p=nxt
                              continue
                          cp=ord(text[p]);p+=1
                          special=4+cp-0xE000 if 0xE000<=cp<=0xE003 else self.vocab.get(text[start:p],0)
                      ids.append(special); starts.append(start); ends.append(p)
                  return ids,starts,ends
          
              @staticmethod
              def softmax(values,temperature):
                  nums=[float(x)/temperature for x in values]
                  mx=max(nums); exp=[math.exp(x-mx) for x in nums]; total=sum(exp)
                  if total<=0 or not math.isfinite(total): raise RuntimeError('softmax 出现异常')
                  return [x/total for x in exp]
          
              def forward(self,ids,mask):
                  if len(ids)>1248 or not ids or len(ids)!=len(mask):
                      raise ValueError('PTE 输入形状错误')
                  torch=self.torch
                  with torch.inference_mode():
                      output=self.forward_method.execute((torch.tensor([ids],dtype=torch.long),torch.tensor([mask],dtype=torch.bool)))
                  if not output or tuple(output[0].shape)!=(1,len(ids),5):
                      raise RuntimeError('PTE 输出不是 [1,L,5]')
                  if not torch.isfinite(output[0]).all(): raise RuntimeError('PTE 输出含非有限数值')
                  self.calls+=1
                  return output[0][0].tolist()
          
              def predict(self,text,ignored):
                  if not any(c in LABELS and not ignored[p] for p,c in enumerate(text)):
                      return text
                  ids,starts,ends=self.encode(text)
                  mask=[b==a+1 and text[a] in LABELS for a,b in zip(starts,ends)]
                  first=self.forward(ids,mask)
                  out=list(text)
                  for i,(a,b) in enumerate(zip(starts,ends)):
                      if not mask[i] or ignored[a]: continue
                      original=text[a]
                      group=0 if original in LABELS[:3] else 3
                      count=3 if group==0 else 2
                      row=first[i]
                      original_p=self.softmax(row[group:group+count],1.0)
                      left,right=a,a
                      while left>0 and text[left-1] in LABELS: left-=1
                      while right+1<len(text) and text[right+1] in LABELS: right+=1
                      if right-left+1>=2 and max(original_p)<.78:
                          one=[False]*len(mask); one[i]=True
                          row=self.forward(ids,one)[i]
                          self.reviews+=1
                      probs=self.softmax(row[group:group+count],TEMPERATURE)
                      best=max(range(count),key=probs.__getitem__)
                      pred=LABELS[group+best]
                      if pred!=original and probs[best]>=THRESHOLDS[pred]:out[a]=pred
                  return ''.join(out)
          
          
          def score(dataset, rows, pipeline, model):
              t0=time.perf_counter()
              counters=dict(exact=0,clean=0,clean_kept=0,wrong=0,wrong_fixed=0,
                            aligned=0,length_changed=0,det_tp=0,det_fp=0,det_fn=0,
                            cor_tp=0,cor_fp=0,cor_fn=0)
              failures=[]
              n_chars=sum(len(x) for x,_ in rows)
              for k,(src,target) in enumerate(rows):
                  prediction=''.join(model.predict(*pipeline.preprocess(part)) for part in split_text(src))
                  if prediction==target:counters['exact']+=1
                  if src==target:
                      counters['clean']+=1
                      if prediction==src:counters['clean_kept']+=1
                  else:
                      counters['wrong']+=1
                      if prediction==target:counters['wrong_fixed']+=1
                  if len(src)==len(target)==len(prediction):
                      counters['aligned']+=1
                      golden={i for i,(x,y) in enumerate(zip(src,target)) if x!=y}
                      altered={i for i,(x,y) in enumerate(zip(src,prediction)) if x!=y}
                      counters['det_tp']+=len(golden&altered)
                      counters['det_fp']+=len(altered-golden)
                      counters['det_fn']+=len(golden-altered)
                      corrected={i for i in altered if i in golden and prediction[i]==target[i]}
                      counters['cor_tp']+=len(corrected)
                      counters['cor_fp']+=len(altered-corrected)
                      counters['cor_fn']+=len(golden-corrected)
                  elif len(prediction)!=len(src):counters['length_changed']+=1
                  if prediction!=target and len(failures)<100:
                      failures.append(dict(index=k,source=src,target=target,prediction=prediction))
                  if (k+1)%200==0:
                      print(f'{dataset}: {k+1}/{len(rows)}',flush=True)
              seconds=time.perf_counter()-t0
              def ratio(a,b):return a/b if b else 0.0
              def f1(p,r):return ratio(2*p*r,p+r)
              dp=ratio(counters['det_tp'],counters['det_tp']+counters['det_fp'])
              dr=ratio(counters['det_tp'],counters['det_tp']+counters['det_fn'])
              cp=ratio(counters['cor_tp'],counters['cor_tp']+counters['cor_fp'])
              cr=ratio(counters['cor_tp'],counters['cor_tp']+counters['cor_fn'])
              m=dict(samples=len(rows),characters=n_chars,exact=ratio(counters['exact'],len(rows)),
                     wrong_exact_fix=ratio(counters['wrong_fixed'],counters['wrong']),
                     correct_preserve=ratio(counters['clean_kept'],counters['clean']),
                     overcorrection=ratio(counters['clean']-counters['clean_kept'],counters['clean']),
                     det_p=dp,det_r=dr,det_f1=f1(dp,dr),cor_p=cp,cor_r=cr,cor_f1=f1(cp,cr),
                     aligned_samples=counters['aligned'],length_changed=counters['length_changed'],
                     seconds=seconds,chars_per_second=ratio(n_chars,seconds),
                     ms_per_sentence=1000*ratio(seconds,len(rows)),model_calls=model.calls,review_calls=model.reviews)
              return m,failures
          
          
          def main():
              source=verify_and_download()
              nums,known,ignore,white,safe=extract_constants(source)
              rules,protected,quant=extract_rules(source)
              dictionary=load_dictionary(white)
              pipe=Pipeline(rules,protected,quant,dictionary,nums,known,ignore,safe)
              model=HcamModel()
              model_sha_match = re.search(r"(?m)^MODEL_SHA='([^']+)'", source)
              if not model_sha_match:
                  raise RuntimeError('模型 SHA 没有读取到')
              dataset_revision = subprocess.run(
                  ['git', '-C', str(DATA_ROOT), 'rev-parse', 'HEAD'],
                  check=True, capture_output=True, text=True).stdout.strip()
              # Smoke test shape and tokenizer even when all targets are ignored in real data.
              smoke='他做的作业。'
              print('Smoke (仅模型预检):',model.predict(smoke,[False]*len(smoke)),flush=True)
              datasets=[('NLPCC2023-Task8',DATA_ROOT/'NLPCC2023/spell/data.jsonl'),
                        ('SIGHAN15-Revised',DATA_ROOT/'yacsc/sighan_revised/test_sighan15.jsonl')]
              results={};failures=[]
              for name,path in datasets:
                  rows=[]
                  with path.open(encoding='utf-8-sig') as f:
                      for i,line in enumerate(f,1):
                          if not line.strip():continue
                          row=json.loads(line)
                          if not isinstance(row.get('source'),str) or not isinstance(row.get('target'),str):
                              raise RuntimeError(f'{path}:{i} 不含标准 source/target')
                          rows.append((row['source'],row['target']))
                  if not rows:raise RuntimeError('测试集为空: '+str(path))
                  print(name,'样本数:',len(rows),flush=True)
                  scores,fails=score(name,rows,pipe,model)
                  results[name]=scores
                  failures.extend(dict(dataset=name,**f) for f in fails)
              def pct(x):return f'{x*100:.2f}%'
              report=['# Dedede Pro HCAM PTE 基准测试','','## 测试说明','',
                      '- 模型：**当前 Android 构建中校验的 HCAM V2 五字 PTE INT8**',
                      f'- PTE SHA256：`{model_sha_match.group(1)}`',
                      f'- 源码提交：`{os.environ.get("GITHUB_SHA", "local")}`；CTCDataset 提交：`{dataset_revision}`',
                      '- 推理：GitHub Ubuntu x86 CPU / ExecuTorch Python Runtime / XNNPACK',
                      '- 数据集：与旧版报告一致（NLPCC2023-Task8、SIGHAN15-Revised）',
                      '- 计分：与旧版报告一致（整句准确率、错句修好率、正确句保持率、检测与纠正 P/R/F1）',
                      '- 纠错流程：Python 对当前 Java 语法规则、词库、保护规则的复现；不是在 Android JVM 内直接运行完整 APP',
                      '- 不含手机内自定义词库与白名单；结果不能当成完整 APP 手机实测',
                      '- x86 CPU 速度不是手机端速度，勿与过去的端侧延迟比较',
                      f'- 温度：**{TEMPERATURE}**；阈值：'+', '.join(f'{x}={THRESHOLDS[x]}' for x in LABELS),
                      f'- 字典：{len(dictionary.words):,}；语法规则：{len(rules):,}；量词：{len(quant):,}；保护正则：{len(protected):,}；跳过词：{len(ignore):,}',
                      '- 连续目标字：同 APP 的二次复核阈值 0.78（先全 Mask，再按需单字 Mask）',
                      '', '## 结果', '',
                      '| 数据集 | 句数 | 原文字符 | 整句完全正确 | 错句整句修好 | 正确句保持率 | 误改率 | 检测 P/R/F1 | 纠正 P/R/F1 | 速度 |',
                      '|---|---:|---:|---:|---:|---:|---:|---:|---:|---:|']
              for name,m in results.items():
                  report.append(f'| {name} | {m["samples"]:,} | {m["characters"]:,} | {pct(m["exact"])} | {pct(m["wrong_exact_fix"])} | {pct(m["correct_preserve"])} | {pct(m["overcorrection"])} | {pct(m["det_p"])}/{pct(m["det_r"])}/{pct(m["det_f1"])} | {pct(m["cor_p"])}/{pct(m["cor_r"])}/{pct(m["cor_f1"])} | {m["chars_per_second"]:.1f} 字/s |')
              report.extend(['','## 附加指标',''])
              for name,m in results.items():
                  report.append(f'- **{name}**：耗时 {m["seconds"]:.2f}s；平均 {m["ms_per_sentence"]:.2f}ms/句；等长对齐 {m["aligned_samples"]:,}/{m["samples"]:,}；输出长度改变 {m["length_changed"]:,}；累计模型调用 {m["model_calls"]:,}（复核 {m["review_calls"]:,}）。')
              report.extend(['', '注：字符级 P/R/F1 与旧版一致，仅统计 source/target/prediction 三者等长样本。跨版本规则与模型均有变化，不能简单理解为同一条件下模型性能变化。'])
              rendered='\n'.join(report)+'\n'
              Path('benchmark_report.md').write_text(rendered,encoding='utf-8')
              Path('benchmark_metrics.json').write_text(json.dumps(results,ensure_ascii=False,indent=2),encoding='utf-8')
              Path('benchmark_failures.jsonl').write_text(''.join(json.dumps(row,ensure_ascii=False)+'\n' for row in failures),encoding='utf-8')
              print(rendered,flush=True)
          
          
          if __name__=='__main__':main()
          PY
          python -m py_compile /tmp/dedede_hcam_benchmark.py
          # Always retain complete benchmark output, even if PTE loading fails.
          python /tmp/dedede_hcam_benchmark.py 2>&1 | tee benchmark_console.log
          {
            echo '## HCAM V2 自动测试完成'
            echo
            cat benchmark_report.md
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Upload score report and failures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dededi-pro-benchmark-report
          path: |
            benchmark_report.md
            benchmark_metrics.json
            benchmark_failures.jsonl
            benchmark_console.log
          if-no-files-found: warn
          retention-days: 90
