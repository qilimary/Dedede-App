      with:
        packages: ''

    - name: Ensure Android 16 SDK and native toolchain
      run: |
        set -euo pipefail
        SDKMANAGER="$(command -v sdkmanager || true)"
        if [ -z "$SDKMANAGER" ]; then
          for candidate in \
            "${ANDROID_SDK_ROOT:-}/cmdline-tools/latest/bin/sdkmanager" \
            "${ANDROID_HOME:-}/cmdline-tools/latest/bin/sdkmanager" \
            "${ANDROID_SDK_ROOT:-}/cmdline-tools/20.0/bin/sdkmanager" \
            "${ANDROID_HOME:-}/cmdline-tools/20.0/bin/sdkmanager" \
            "${ANDROID_SDK_ROOT:-}/cmdline-tools/16.0/bin/sdkmanager" \
            "${ANDROID_HOME:-}/cmdline-tools/16.0/bin/sdkmanager"; do
            if [ -n "$candidate" ] && [ -x "$candidate" ]; then
              SDKMANAGER="$candidate"
              break
            fi
          done
        fi
        if [ -z "$SDKMANAGER" ]; then
          echo "Android SDK command-line tools were not found after setup-android." >&2
          exit 1
        fi
        "$SDKMANAGER" "platforms;android-36" "build-tools;35.0.0" "ndk;27.0.12077973" "cmake;3.22.1" >/dev/null

    - name: Set up Gradle 8.13
      uses: gradle/actions/setup-gradle@v4
      with:
        gradle-version: '8.13'

    - name: Build APK (Release mode)
      run: |
        set -o pipefail
        gradle assembleRelease --stacktrace --console=plain > build_output.log 2>&1 || {
          echo "### ❌ 编译未通过！以下是具体报错信息：" >> "$GITHUB_STEP_SUMMARY"
          echo '```text' >> "$GITHUB_STEP_SUMMARY"
          tail -n 300 build_output.log >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "### 🔍 关键错误提取：" >> "$GITHUB_STEP_SUMMARY"
          echo '```text' >> "$GITHUB_STEP_SUMMARY"
          grep -E "error:|ERROR:|FAILED|Exception|cannot find symbol|method does not" build_output.log | head -50 >> "$GITHUB_STEP_SUMMARY" || true
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          exit 1
        }

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: dedede
        compression-level: 6
        path: app/build/outputs/apk/release/app-release.apk
        if-no-files-found: error
